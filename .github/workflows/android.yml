name: Build MPP/VPU for Android 12

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
    env:
      NDK_VERSION: r25c
      ANDROID_API_LEVEL: android-31

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip -O ndk.zip
          unzip -q ndk.zip -d $HOME
          echo "ANDROID_NDK=$HOME/android-ndk-${NDK_VERSION}" >> $GITHUB_ENV

      - name: Configure CMake (${{ matrix.abi }})
        run: |
          mkdir -p build_android
          cd build_android
          cmake \
            -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK}/build/cmake/android.toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_NDK=${ANDROID_NDK} \
            -DANDROID_NATIVE_API_LEVEL=${ANDROID_API_LEVEL} \
            -DANDROID_STL=c++_static \
            -DANDROID_FORCE_ARM_BUILD=ON \
            -DMPP_PROJECT_NAME=mpp \
            -DVPU_PROJECT_NAME=vpu \
            -DHAVE_DRM=ON \
            -DBUILD_TEST=OFF \
            ..

      - name: Build
        run: cmake --build build_android -j $(nproc)

      - name: Collect artifacts
        run: |
          mkdir -p output/lib output/include
          # Collect built libraries
          find build_android -name "*.so" -exec cp {} output/lib/ \;
          find build_android -name "*.a" -exec cp {} output/lib/ \;
          # Collect public headers
          if [ -d inc ]; then
            cp -r inc/* output/include/
          fi
          # List output for verification
          echo "=== Libraries ==="
          ls -lh output/lib/
          echo "=== Headers ==="
          ls -lh output/include/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mpp-vpu-android12-${{ matrix.abi }}
          path: output/
          retention-days: 30
